# Seed memories for the meme-cohort study (configs/homewood100_memes.yaml).
#
# What every agent starts this study with, and why (task 3g):
#   * NO phrase and none of any phrase's distinctive words (R1, R2). The naming study's seed file handed every
#     agent a ready-made label; here the only text in the whole run that carries a coined phrase is the seeded
#     minority's habit line.
#   * NO canonical campus name (R3). Every place below is read AT GENERATION TIME out of
#     backend/simulation/world.py, so a seed memory and a percept refer to the same place in exactly the same
#     words. Hard-coding the descriptions here is how the two quietly drift apart.
#   * Something for an incident to ATTACH to, for the GROUNDED memes only. An incident on the serving floor is
#     a fact about a place the agent already eats at; one on the wet-work side is about a bench it already
#     shares. The ungrounded memes get nothing here on purpose: a pre-loaded referent for them would be
#     grounding, and grounding is the factor under manipulation.
#   * A REASON TO REFER. Two dining halls, not one, so settling where to eat is a real decision. Agents
#     referred to the dining hall 0.16 times per agent-day in the naming run; a choice between two places is
#     the cheapest honest way to raise that without telling anyone to name anything.
#
# Generated from configs/population/homewood100.yaml and backend/simulation/world.py; regenerate
# rather than hand-edit, so the place descriptions cannot fall out of step with the world.
