  dorm_a: [maya, priya]
  dorm_b: [ethan, leo]
  probability_class: [maya, ethan, jordan]
  comp_bio_lab: [maya, dev, hana]
  a_cappella: [priya, sofia]
  outdoors_club: [sofia, hana]
