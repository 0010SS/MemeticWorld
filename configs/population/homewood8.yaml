      - {time: "18:30", location: Dining Hall, activity: eating dinner}
      - {time: "19:30", location: Library, arena: Study Tables, activity: writing her thesis}
      - {time: "21:30", location: Dorm, arena: Room 402, activity: winding down}

  - id: sam
    name: Sam Rivera
    sprite: Sam_Moore
    demographics: {age: 20, year: junior, major: Electrical Engineering, role: transfer undergraduate}
    background: >-
      From Philadelphia; transferred this semester; joined the robotics team and chess club; newly rooms with Jordan.
      Wants to contribute a reliable control circuit to the team's robot and find a small circle of friends.
      Values practical competence and independence, but finds it easier to ask a technical question than to admit
      feeling socially out of place. Knows Ethan through the makerspace and appreciates Jordan's patience;
