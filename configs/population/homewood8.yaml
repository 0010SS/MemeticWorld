    personality:
      traits: [reserved, curious, methodical]
      communication_style: >-
        Direct and concrete when discussing a build; initially quiet in unfamiliar company.
        Asks for missing context when comfortable and becomes animated when comparing possible solutions.
        Prefers a specific explanation to reassurance, but does not always say immediately when feeling confused.
    interests: {topics: [control systems, electronics], hobbies: [chess, repairing old radios], clubs: [robotics team, chess club]}
    habits: [carries a notebook of circuit sketches, checks connections before powering a device, eats lunch with teammates when invited, plays evening chess in the dorm lounge]
