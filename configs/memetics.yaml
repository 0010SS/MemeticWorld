# Campus society reference; change population and population_size for your study.
extends: configs/baseline.yaml
run_name: memetics_campus
population: configs/population/homewood8.yaml
population_size: 16
simulation_days: 30
latent_events:
  event_rate: 0
conversation:
  catchup: {enabled: true}
  group: {enabled: true}
reminding: {enabled: true}
memory:
  verbatim: {enabled: true}
retrieval:
  source_weights: {seed: 0.5, ambient: 0.5}
analysis:
  pipeline: memetics
  probes: false
  observer: {backend: openai, model: $OPENAI_OBSERVER_MODEL}

llm:
  backend: openai
  model: $OPENAI_MODEL
