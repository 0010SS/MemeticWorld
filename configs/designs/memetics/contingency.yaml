name: memetics_contingency
description: Contingency and recurring cultural patterns
base: configs/memetics.yaml
seeds:
- 11
- 12
- 13
- 14
- 15
replicates: 2
observer:
  backend: openai
  model: $OPENAI_OBSERVER_MODEL
questions:
- Which ideas recur across independent societies and agent models, and which histories
  are society-specific?
common: {}
factors:
  agent_model:
    mini:
      llm:
        model: gpt-5.4-mini
    full:
      llm:
        model: gpt-5.4
outcomes:
- memetics.n_threads
- memetics.n_multi_agent_threads
- memetics.n_changes
- memetics.mean_public_users
- memetics.mean_senses
- memetics.mean_persistence_days
- memetics.n_supported_reuses
- memetics.mean_agent_agreement
