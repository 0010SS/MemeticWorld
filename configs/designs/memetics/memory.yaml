# Complete experiment preset. Edit levels, horizons and seeds for the research question.
"name": "memetics_memory"
"description": "Memory and transformation"
"base": "configs/memetics.yaml"
"seeds":
  - 11
  - 12
  - 13
  - 14
  - 15
"replicates": 1
"observer":
  "backend": "claude_cli"
  "model": "sonnet"
"questions":
  - "How do reconstructive memory and wording retention affect the preservation and transformation of ideas?"
"common": {}
"factors":
  "encoding":
    "verbatim":
      "memory":
        "encoding_noise": 0
    "reconstructive":
      "memory":
        "encoding_noise": 0.3
    "lossy":
      "memory":
        "encoding_noise": 0.7
  "wording":
    "off":
      "memory":
        "verbatim":
          "enabled": false
    "on":
      "memory":
        "verbatim":
          "enabled": true
"outcomes":
  - "memetics.n_threads"
  - "memetics.n_multi_agent_threads"
  - "memetics.n_changes"
  - "memetics.mean_public_users"
  - "memetics.mean_senses"
  - "memetics.mean_persistence_days"
  - "memetics.n_supported_reuses"
  - "memetics.mean_agent_agreement"
