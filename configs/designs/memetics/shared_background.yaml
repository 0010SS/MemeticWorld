name: memetics_shared_background
description: Shared background and cultural development
base: configs/memetics.yaml
seeds:
- 11
- 12
- 13
- 14
- 15
replicates: 1
observer:
  backend: openai
  model: $OPENAI_OBSERVER_MODEL
questions:
- How is supplied shared knowledge reused, rejected or reinterpreted, and what additional
  ideas develop?
common: {}
factors:
  introduction:
    absent:
      shared_background:
        file: null
        markdown: null
    supplied:
      shared_background:
        file: configs/backgrounds/campus.md
outcomes:
- memetics.n_threads
- memetics.n_multi_agent_threads
- memetics.n_changes
- memetics.mean_public_users
- memetics.mean_senses
- memetics.mean_persistence_days
- memetics.n_supported_reuses
- memetics.mean_agent_agreement
