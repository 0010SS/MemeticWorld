# Default experiment configuration (ontology v2, see docs/ONTOLOGY_V2.md).
# Every run stores the fully resolved copy as runs/<run_id>/config.resolved.yaml.
#
# BASELINE = the plain cognitive model: GA-style perception/memory/retrieval/reflection/conversation,
# plus partial perception with viewpoints (D42) and lossy reconstructive memory (D44).
# Every meme-formation MECHANISM is OFF here and is switched on by exactly one key:
#   NEED    : latent_events.referents.enabled, latent_events.assignment.mode, conversation.catchup.enabled,
#             conversation.group.enabled, need.enabled
#   LINK    : reminding.enabled, latent_events.link_visibility
#   WORDING : memory.verbatim.enabled, priming.enabled, retrieval.source_weights
#   MEMES   : memes.enabled (the injected cohort, see `memes:` below), conversation.repair.enabled
run_name: default
seed: 42
world_seed: null            # null -> seed. The world script (events, casting, referents) uses only this seed,
                            # so conditions sharing world_seed see identical events (common random numbers).
population: configs/population/homewood8.yaml
population_size: 16         # first N agents of the population file
initial_memories_file: null # optional per-agent one-time seed memories; no permanent linguistic habit
initial_memories_importance: 5   # GA importance (1-10) of those seed memories. They stay MEMORIES: they decay,
                            # compete for retrieval and can be forgotten; raising this only makes them
                            # reachable when the topic comes up, it never makes them a persona habit.
                            # 5 = the v2 behaviour (the same importance as the seeded relationship facts).
shared_background:          # optional shared Markdown introduction, retained in identity prompts
  file: null                # UTF-8 Markdown file, relative to repository root or absolute
  markdown: null            # inline text; resolved files are frozen here for replay
  sha256: null
simulation_days: 3
start_date: "2026-09-14"    # a Monday
day_start: "07:30"
day_end: "22:30"
tick_minutes: 15

# Legacy world selection; the co-op is enabled through its existing mechanisms.
# reference_mode: how the world refers to a place when it talks to an agent (backend/simulation/reference.py).
#   canonical = v2 behaviour, the canonical key ("the Dining Hall"), so existing runs reproduce.
#   situated  = a relative description ("the dining hall beside the freshman residences"). The world gives
#               percepts, never proper names; naming is the agents' business. Required by the seeded naming
#               experiment, which cannot measure whose name wins while every prompt supplies the world's own.
world: {mode: latent_events, reference_mode: canonical}
commons: {}

llm:
  backend: claude_cli       # claude_cli | anthropic | mock | auto
  model: haiku
  max_workers: 6
  replay_from: null         # path to a previous run's llm_calls.jsonl -> deterministic replay
  replay_until_tick: null   # v3 branches: serve the parent's cache strictly before this tick, never after
  fail_fast: {max_consecutive_errors: 3, pause_seconds: 600, max_pauses: 6}

embedding:
  backend: hash             # hash | sentence_transformers
  dim: 512

topology:
  mode: file                # file (population file circles/relationships) | generated
  generated:
    n_circles: 2
    familiarity_within: 0.75
    affinity_within: 0.7
    p_between: 0.15
    familiarity_between: 0.15
    n_bridges: 2
    shared_meals: true      # each circle gets a shared dinner slot, so co-location agrees with ties

memory:
  encoding_noise: 0.3       # 0 = perfect verbatim memory ... 1 = gist only
  decay_rate: 0.1           # per simulated hour, used in recency = exp(-decay_rate * hours)
  memory_capacity: 80       # max nodes per agent before forgetting the weakest. 300 never bound (peak
                            # store ~100-150), so nothing was lost after encoding and the transmission
                            # bottleneck the iterated-learning argument rests on had no mechanism (D74).
  protect_sources: [seed]   # source types the capacity cliff reaches last: what the agent was handed
                            # before the run (who the people around it are), not what it experienced in
                            # it. [] = v2 behaviour, every memory competes on importance x recency.
  merge_threshold: 0.92     # embedding cosine above which a new memory merges into an old one (only if noise > 0)
  entity_generalization: 0.5  # prob. multiplier for replacing unfamiliar names with a role ("a student")
  encoding_variability: 1.0  # sampled memory lens per encoding (D44); 0 = fixed encoding prompt
  verbatim:                  # WORDING: distinctive heard wording that sticks word for word (D49, fixed in v2)
    enabled: false
    base: 0.3                # p(stick) for a new distinctive phrase
    familiarity_gain: 0.2    # + per existing memory already containing the phrase
    max: 0.9
    max_phrases: 2
    zipf_max: 3.6            # a distinctive phrase needs a word at most this frequent (wordfreq Zipf)
    distinctiveness: lexicon # lexicon (rare AND not campus/routine vocabulary) | zipf (rare only)
    exclude_self: true       # the agent's own utterances never "stick" as heard wording
    render_in_text: true     # also quote stuck wording in the memory description
    on_sources: [conversation, overheard]   # v3_base adds record

priming:                    # WORDING: recently heard wordings are in mind when speaking
  enabled: false
  window_hours: 24
  max_phrases: 3

retrieval:
  alpha: 3.0                # relevance weight   (GA gw[1])
  beta: 0.5                 # recency weight     (GA gw[0])
  gamma: 2.0                # importance weight  (GA gw[2])
  temperature: 0.7          # softmax temperature; 0 = deterministic GA top-k
  top_k: 5
  source_weights: {}        # WORDING/NEED: e.g. {seed: 0.5, ambient: 0.5} (D50); {} = GA behaviour

reflection:
  enabled: true
  importance_threshold: 60  # GA importance_trigger_max (150 upstream; lower because our days are short)
  n_focal_points: 2
  n_insights: 3

reminding:                  # LINK: a new experience may bring an earlier one to mind (D48, extended in v2)
  enabled: false
  on_sources: [perception, conversation, overheard]
  min_salience: 0.45
  n_related: 4              # most related earlier experiences (stochastic retrieval)
  n_salient: 3              # plus salient older experiences, sampled by importance
  min_age_minutes: 90
  reflection_weight: 0.0    # share of a reminding thought's importance counted toward GA's reflection trigger

need:                       # NEED: unresolved matters stay on an agent's mind and cue conversation
  enabled: false
  min_importance: 6
  half_life_hours: 24
  max_open: 3
  discuss_decay: 0.5

perception:
  base_attention: 0.45
  other_arena_factor: 0.35  # attention multiplier for events in the same building but a different room
  busy_factor: 0.6          # attention multiplier while in a conversation
  familiarity_weight: 0.8   # attention x (1 + this x familiarity) for facts involving familiar people.
                            # MULTIPLICATIVE since D74: the social term is now under load like everything
                            # else. 0.8 holds the median p_attend of familiar observers where +0.25 put it.
  crowd_factor: 0.92        # attention x this per other agent in the same ROOM beyond 2 (D45, rescoped D74)
  building_crowd_factor: null  # optional second-order load: x this per other agent elsewhere in the
                            # building beyond 2. null/0 = off (the building is not the observer's field)
  viewpoints: true          # render each observer's own version of perceived facts (D42)
  ambient_max_per_tick: 2   # notice at most N co-present people per tick (crowds flooded memory: a 100-agent
                            #   mock day encoded 27.5k ambient memories and forgot 27.5k of them); -1 = no cap
  overhear_prob: 0.3        # prob. a bystander in the same room hears a given utterance

conversation:
  max_utterances: 4
  base_talk_prob: 0.35      # stochastic gate before the GA decide_to_talk prompt
  pair_cooldown_minutes: 150
  max_per_agent_per_day: 6
  invite_prob: 0.15
  catchup:                  # NEED: evening catch-up between close friends (D47)
    enabled: false
    after: "17:00"
    min_familiarity: 0.6
    prob: 0.8
  catchup_max_utterances: 6
  mealtalk:                 # a REASON TO REFER: people who have not eaten yet settle where they are going.
    enabled: false          #   One context line and one meal focal point; no place is ever named and no one
    windows: ["11:30-13:30", "17:30-19:00"]   # is asked to invent a name (backend/agents/conversation.py).
    prob: 0.6               # per conversation that starts in a window with a meal still ahead of a participant
  group:                    # NEED: multi-party talk at shared venues (meal tables)
    enabled: false
    # Both dining halls. A venue nobody is standing in costs nothing and draws no random number (the
    # engine skips a venue before the per-window draw when fewer than `min_participants` are there), so
    # adding the second hall leaves every existing run byte-identical while making the control hall a
    # real place where a table forms. Listing only the exposed hall would have put every group meal in
    # the one room the meme incidents happen in.
    venues: [["Dining Hall", "Main Floor"], ["Nolans", "Servery"]]
    windows: ["12:00-13:30", "18:00-19:30"]
    min_participants: 3
    max_participants: 5
    max_utterances: 8
    prob: 0.5
  repair:                   # MEMES: ordinary clarification -- "what do you mean by that?" -- and one answer.
    # Not a mechanism for spreading a phrase: a mechanism for NEGOTIATING one. The research memo (§5,
    # GlossoGen) is explicit that a world which forbids explicit discussion is a different experiment from
    # one that allows it, and RQ1 lists "misunderstanding followed by repair" as one of the five routes by
    # which an expression acquires a new shared interpretation. Without it a hearer who does not understand
    # a coined phrase has no move except to drop it, and every meme dies for the same uninteresting reason.
    # These three keys are the experimental dial and nothing else belongs here. The mechanism's other
    # constants (phrase_source, zipf_max, lexicon_filter, min_speaker_memories, collide_below, explain_k)
    # live in backend/agents/repair.py's DEFAULTS, so a config carrying only these three behaves exactly
    # as specified; setting one of them in a config warns as an unknown key, which is the intended signal
    # that you are reaching past the dial into the mechanism.
    enabled: false
    prob: 0.7               # p(a listener who did not understand actually asks), per opportunity
    max_followups: 1        # answers the asker gets back; 1 keeps repair from eating a short conversation

routine:
  jitter_minutes: 20
  deviation_prob: 0.08
  errands_per_day: 2        # short trips to public places, inserted into free gaps of the routine (0 = v2.0 plans)
  errand_places: null       # null -> the public places (backend.simulation.world.PUBLIC_PLACES)
  errand_minutes: [30, 45]
  errand_window: ["08:00", "21:00"]

latent_events:
  event_rate: 0.12          # instances per usable tick. A start in a day's last 4 ticks would cross the day end,
                            # so usable ticks per day = ticks_per_day - 4 (56 of 60 by default)
  schedule: balanced        # balanced: exactly round(event_rate x usable ticks) instances every day (7 by default),
                            #   starts spread over the day with jitter, families in blocks that contain every
                            #   family once, holdout a steady share of each family's instances
                            # bernoulli: the v2.0 schedule, an instance starts at each usable tick with prob.
                            #   event_rate; family and holdout drawn independently per instance
  families: [E1, E2, E3, E4]
  family_weights: {E1: 1.0, E2: 1.0, E3: 1.0, E4: 1.0}
  structure: real           # real | scrambled (random labels, composed nodes) | none (E0 plain mishaps)
  holdout_frac: 0.25        # share of instances that use a held-out skin (interleaved from day 1)
  link_visibility: 0.0      # LINK: prob. an instance's private "inner" fact is visible to everyone present
  assignment:               # NEED: who instances happen to
    mode: none              # none | balanced (circles round-robin) | home (family -> circle, rotated by world_seed)
    strength: 0.7           # prob. P (and S) are cast from the assigned circle
  referents:                # NEED: persistent, family-neutral things instances can recur around
    enabled: false
    reuse: 0.6              # prob. an instance reuses a referent its circle has already met (any domain; the
                            # instance then uses its family's skin for that referent's domain)
  script_from: null         # path to a world_script.jsonl to reuse verbatim; raises unless it fits this run
                            # (population, clock, circles, world_seed; checked against its .meta.json or the
                            # manifest.json of the run it came from)

reaction:
  enabled: true
  min_salience: 0.5         # observations below this don't trigger an LLM reaction decision

modules:
  emotion: false
  social_reward: false
  prestige_bias: false
  conformity: false

module_params:
  emotion: {decay_per_hour: 0.15, salience_gain: 0.5, contagion: 0.2}
  social_reward: {lam: 1.0, importance_gain: 2.0}
  prestige_bias: {attention_gain: 0.3, importance_gain: 1.5, scores: {}, scores_source: degree}
  conformity: {strength: 0.6, sim_threshold: 0.35}

controls:
  planted_phrase: null      # positive control: {agent: maya, habit: "Maya has a habit of calling any mess \"a full pickle\"."}

# ---------------------------------------------------------------- MEMES: the injected cohort
# `controls.planted_phrase` plants ONE phrase in ONE agent, which tells you that a phrase spread or did not.
# It cannot tell you WHY, because n=1 has nothing to contrast with. The registry injects a COHORT of phrases
# that differ along dimensions we control, so the finding is which property predicts survival and
# reinterpretation rather than an anecdote about one coinage.
#
# EVERY MEME IS DATA, NEVER CODE. Nothing in backend/ may name a phrase, an id, a location or a habit from
# this registry: adding, removing or swapping a meme is a config edit. The prior check can disqualify a
# phrase (a phrase a fresh model coins by itself cannot distinguish transmission from rediscovery), and when
# it does, the replacement must be a one-line change here.
#
# Entry schema -- every key, and why it exists:
#   id               stable slot label used by traces, probes and analysis. It names the 2x2 CELL and the
#                    origin, not the phrase, so swapping the phrase leaves every trace field valid.
#   phrase           the coined expression. Appears in exactly one place in the whole run: the habit line
#                    of the seeded minority (R1). Two tokens, both content words, at least one of them rare
#                    enough to survive `memory.verbatim` -- see the registry in the study config for the
#                    measured check.
#   grounding        grounded | ungrounded -- factor 1. Grounded = a witnessed origin event exists.
#   breadth          broad | narrow -- factor 2. Broad = the phrase's referent is a class of situations and
#                    can move; narrow = it names one individual and cannot broaden by construction.
#   habit            the name-free habit fragment given to the seeded minority, in the shape the profile
#                    renders ("<First> <habit>; <habit>."). It states the seed's OWN usage; it is never a
#                    dictionary entry handed to anyone else (R7).
#   seeds            {k, strategy, agents} -- the committed minority. `agents`, when given, is an explicit
#                    id list and wins over `strategy`: matching the cohorts on graph position (R6) is not
#                    something a sampling strategy can guarantee, and an unmatched cohort makes a spread
#                    difference attributable to the graph instead of to the factors.
#   incident         the world event the meme is grounded in, or null for an ungrounded meme. `repaired_day`
#                    is the manipulation: the basis of the grounded memes is removed partway through, and
#                    the ungrounded memes have no basis to remove, which is what makes them the comparison.
#   distinctive_words  the words that must never appear in ANY world-emitted text (R2). A compositional
#                    coinage an agent can assemble from words the world handed it makes transmission
#                    indistinguishable from independent rediscovery, which is the single easiest way to
#                    ruin this experiment. Machine-checked; the phrase itself is forbidden by R1 anyway.
#   probe_gradient   OBSERVER ONLY. Situations at increasing distance from the origin, used to tell dying
#                    from calcifying from broadening. Must never reach an agent (R7).
#   foils            OBSERVER ONLY. Situations that share the phrase's surface features and not its
#                    structure, so "applies to everything" is not scored as broadening.
memes:
  enabled: false            # off -> no habit is planted, no incident is staged, nothing is traced (R5)
  registry: []              # filled by the study config; see configs/homewood100_memes.yaml

# ---------------------------------------------------------------- v3 (docs/ONTOLOGY_V3.md §8.2); all OFF
workshop:
  enabled: false
  content: laser_alpha              # laser_alpha | laser_beta
  jobs_ticks: [6, 10, 14, 18, 24, 28, 32, 36]
  p_fault: 0.75
  class_weights: {K1: 0.70, K2: 0.30}
  k3_from_k0: 0.6
  success: {match: 0.85, other_fix: 0.10, rerun: 0.10, slow: 0.35, slow_belt: 0.20}
  max_attempts: 2
  panel_code: {enabled: false, text: "F4", prob: 0.5}
  oddity_prob: 0.3
  symptom_visibility: arena
  encode: per_job                   # per_job | per_beat
  encode_reason: true
  causal: real                      # real | scrambled
  tally_time: "17:30"

regimes: {mapping: auto, schedule: [{day: 1, regime: A}], cues: [], split: null}

records:
  enabled: false
  display: current                  # none | current | history
  history_from_day: null
  consult: always                   # always | on_choice | never
  consult_from_day: null
  view_log_n: 5
  front_max_chars: 600
  log_max_chars: 200
  revisable: true
  retrieval: recent                 # recent | relevant
  encode_on_read: new_only          # new_only | never
  write_after: [faulted_job, tally, farewell]
  authority: members                # members | manager_signed
  replies: false
  transitions: []                   # [{day, mode: keep|wipe}]

roster: {enabled: false, shifts: {am: "08:45-13:15", pm: "13:00-17:45", stores: ["08:45-12:00", "13:00-17:45"]}}
turnover: {enabled: false, waves: [], rotate: by_world_seed, crew_familiarity: 0.35, member_familiarity: 0.2,
           farewell: true, reassign: []}

comm:
  clarify: {enabled: false, max_per_job: 1, max_utterances: 4}
  handover: {enabled: false, time: "13:15", max_utterances: 6}
  meeting: {enabled: false, days: [2, 5], time: "18:30", max_utterances: 10, max_participants: 8}

checkpoints: {enabled: false, days: all}
branch: {parent: null, at_day: null, salt: null}
probe: {backend: claude_cli, model: haiku, workers: 8, k: 6, tau: 0.7, framings: [note, text, overheard]}

analysis:
  pipeline: legacy          # legacy | memetics
  memetics: {}               # open observer settings (windows, history, private evidence)
  judge: {provider: claude_cli, model: sonnet, prompt_version: v1}   # LLM-as-judge (backend/analysis/judge.py); swap for a stronger judge
  live: {min_speakers: 1, min_uses: 2, pool: 60, trend_window: 12, transmission_top: 10}
  coder: {backend: claude_cli, model: sonnet, second: haiku, blind: true, human_sample: 120}
  llm_classifier: true
  probes: true
  min_speakers: 2
  min_uses: 3
  observer: {backend: null, model: null}   # fixed observer LLM; null -> the agents' llm settings
  permutations: 1000
  fdr_q: 0.1
