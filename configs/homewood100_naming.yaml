# Connected 100-person cut of the seeded naming experiment; see docs/HOMEWOOD_100_SUBSET.md.
# Same design as configs/homewood500_naming.yaml on a subset chosen for an exact 20/80 split and a
# surviving social network (214 of 1,404 edges, mean degree 4.28, largest component 97).
# Cell 1 of 2: plain cognition, every meme-formation mechanism off (the baseline).
extends: configs/baseline.yaml
run_name: homewood100_naming
seed: 42
world_seed: 42
population: configs/population/homewood100.yaml
population_size: 100
initial_memories_file: configs/population/homewood100_initial_memories.yaml
# The seeded name has to be RETRIEVABLE when a meal comes up, or it never reaches speech and the experiment
# measures nothing. Measured on 1-day mock runs of this cell as configured below (100 agents, ~1,300
# utterances each), seed retrievals per 100 utterances / agents recalling their seed at least once:
#     importance   5      6      7      8        (no meal cue, importance 5: 16.2 and 81 of 100)
#     per 100    19.7   26.9   32.6   33.6
#     agents       87     94     97     98
# 7 is where the curve flattens: 6 -> 7 is worth +5.8 per 100, 7 -> 8 only +0.9. And 7 is the last value at
# which the memory is still TOPICAL rather than constant -- under the meal cue it comes back 2.06x as often
# as outside it, against 1.91x at 8, where the off-topic rate (31.4 per 100) has caught up with the cued one.
# A memory the agent recalls whatever the subject is has stopped being a memory and become a habit, which
# is precisely what this experiment may not assume. Crowding is unchanged: pre-run seed material is 36.9% of
# retrieved memories at 7 against 37.9% at 5, so the naming seed displaces other seeds, not lived experience.
initial_memories_importance: 7
simulation_days: 3
day_start: "08:30"
day_end: "17:00"
llm:
  backend: claude_cli
  model: haiku
  max_workers: 12
routine:
  jitter_minutes: 0
  deviation_prob: 0
world:
  # The world describes the place, it never names it: agent-facing text says "the dining hall beside the
  # freshman residences", and the only names in an agent's head are the one it was seeded with and the ones
  # it hears from other people. Without this the world supplies "Dining Hall" in most chat prompts and the
  # cell cannot measure whose name wins.
  reference_mode: situated
conversation:
  invite_prob: 0
  mealtalk:
    # A reason to refer. Two people who still have a meal ahead of them, meeting between 11:30 and 13:30,
    # have to settle where they are going -- the everyday moment at which a place gets referred to at all.
    # One context line, no place name, no suggestion to invent one. In a 1-day mock run it fires in 8-10%
    # of conversations, reaching 39-47 of the 100 agents in a single day, and where it fires it nearly
    # doubles how often a meal memory reaches the prompt (48.8% of cued utterances against 26.5% of uncued
    # ones at the default seed importance). The 17:30-19:00 window never fires in this scenario: the day
    # ends at 17:00. Only dyads are cued; group talk at a table already has its own meal line.
    enabled: true
topology:
  mode: file
latent_events:
  event_rate: 0
analysis:
  llm_classifier: true
  probes: false
